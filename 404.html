<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scroll-progress" id="scrollProgress"></div>

  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <nav class="nav">
    <a href="/" class="nav-logo">Cenry</a>
    <ul class="nav-links">
      <li><a href="/">首页</a></li>
      <li><a href="digest.html">简报</a></li>
      <li><a href="merge-quest.html">游戏</a></li>
    </ul>
  </nav>

  <section class="section">
    <h2 class="section-title">404 · 这里什么都没有</h2>
    <div class="about-card glass">
      <p>你访问的页面不存在，或者已经被移除了。</p>
      <p>之前站点上的「热榜」「机器人文献」两个页面已经下线，如果你是顺着旧链接或收藏过来的，可以从下面的入口继续逛。</p>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div>© <span id="year">2026</span> CenryWang</div>
  </footer>

  <script>
    var y = document.getElementById("year");
    if (y) y.textContent = new Date().getFullYear();
    var bar = document.getElementById("scrollProgress");
    window.addEventListener("scroll", function () {
      var h = document.documentElement;
      bar.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100 + "%";
    });
  </script>
</body>
</html>
