name: Sync RSS digest

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30，在 garss 每天 06:00 构建之后
    # GitHub 定时任务有延迟；同步到前一天内容时次日自愈，或手动 Run
    - cron: '30 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 避免并发 push 冲突
concurrency:
  group: content-update

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage repo
        uses: actions/checkout@v7

      - name: Clone garss fork (daily digest source)
        # garss 是公开仓库，匿名 clone 即可；不携带 GITHUB_TOKEN 可避免跨仓库 403
        run: git clone --depth 1 https://github.com/CenryWang/garss.git garss

      - name: Build digest.html
        # 源数据过期或格式异常时 build_digest.py 会以非零码退出，让本步失败、
        # 工作流变红——绝不静默发布旧内容。
        # 附加源通过 --feed 传入（可重复）：AIHOT 是公开 RSS；TrendRadar 来自你
        # 的轻量服务器（TRENDRADAR_RSS_URL 仓库密钥，含 token）。任一附加源抓取
        # 失败时只跳过对应区块并告警，绝不连累 garss 主源（详见 scripts/build_digest.py）。
        env:
          TRENDRADAR_RSS_URL: ${{ secrets.TRENDRADAR_RSS_URL }}
        run: |
          python3 -m pip install --user --quiet markdown
          python3 scripts/build_digest.py garss/README.md digest.html \
            --feed "AIHOT 精选 · 数字生命卡兹克|https://aihot.news/feed.xml" \
            --feed "热搜雷达 · TrendRadar|${TRENDRADAR_RSS_URL}|来自你的轻量服务器 TrendRadar 实时热搜聚合，按人工智能/具身智能/机器人/自动驾驶/新能源汽车/智能体/RSI 方向优先展示；内容版权归各平台与作者所有。" \
            --feed "论文速递 · arXiv 人工智能|https://rss.arxiv.org/rss/cs.AI|arXiv cs.AI 每日新论文（周六周日 arXiv 不发布更新，届时本区块缺席属正常）。" \
            --feed "论文速递 · arXiv 机器人|https://rss.arxiv.org/rss/cs.RO|arXiv cs.RO 每日新论文，覆盖具身智能、人形机器人、自动驾驶。" \
            --feed "论文速递 · arXiv 多智能体|https://rss.arxiv.org/rss/cs.MA|arXiv cs.MA 每日新论文，覆盖智能体与多智能体系统。"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS digest $(date -u +'%Y-%m-%d')"
            # 推送前先接到远端最新：手工提交或并发任务抢先 push 时，
            # 否则 push 会被 rejected（fast-forward 检查失败）
            git pull --rebase origin main
            git push
          fi
