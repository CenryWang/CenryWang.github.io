name: Sync RSS digest

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30，在 garss 每天 06:00 构建之后
    # GitHub 定时任务有延迟；同步到前一天内容时次日自愈，或手动 Run
    - cron: '30 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 避免并发 push 冲突
concurrency:
  group: content-update

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage repo
        uses: actions/checkout@v7

      - name: Clone garss fork (daily digest source)
        # garss 是公开仓库，匿名 clone 即可；不携带 GITHUB_TOKEN 可避免跨仓库 403
        run: git clone --depth 1 https://github.com/CenryWang/garss.git garss

      - name: Build digest.html
        run: |
          python3 -m pip install --user markdown
          python3 scripts/build_digest.py garss/README.md digest.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS digest $(date -u +'%Y-%m-%d')"
            git push
          fi
